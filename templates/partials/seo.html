<!-- SEO partial — rendered per-page by build.js; do not edit placeholders -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="X-UA-Compatible" content="IE=edge">

<title>{{seo.pageTitle}}</title>
<meta name="description" content="{{seo.metaDescription}}">
<link rel="canonical" href="{{seo.canonical}}">

<!-- Open Graph -->
<meta property="og:type"        content="{{seo.ogType}}">
<meta property="og:site_name"   content="{{site.name}}">
<meta property="og:title"       content="{{seo.ogTitle}}">
<meta property="og:description" content="{{seo.metaDescription}}">
<meta property="og:url"         content="{{seo.canonical}}">
<meta property="og:image"       content="{{seo.ogImage}}">
<meta property="og:image:alt"   content="{{seo.ogTitle}}">
<meta property="og:locale"      content="{{site.language}}">
{{#if seo.articlePublishedTime}}<meta property="article:published_time" content="{{seo.articlePublishedTime}}">{{/if}}
{{#each seo.articleTags}}<meta property="article:tag" content="{{.}}">
{{/each}}

<!-- Twitter / X card -->
<meta name="twitter:card"        content="summary_large_image">
<meta name="twitter:site"        content="{{site.twitterHandle}}">
<meta name="twitter:title"       content="{{seo.ogTitle}}">
<meta name="twitter:description" content="{{seo.metaDescription}}">
<meta name="twitter:image"       content="{{seo.ogImage}}">

<!-- JSON-LD -->
<script type="application/ld+json">{{raw:seo.jsonLd}}</script>

<!-- Feeds & favicon -->
<link rel="alternate" type="application/atom+xml" title="{{site.name}} – Resources" href="{{site.baseUrl}}/feed.xml">
<link rel="icon" type="image/png" href="{{site.routePrefix}}/favicon.png" sizes="96x96">
<link rel="apple-touch-icon" href="{{site.routePrefix}}/favicon.png">
