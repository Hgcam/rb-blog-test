<a class="skip-link" href="#main-content">Skip to content</a>

<header class="site-header" role="banner">
  <div class="site-header__inner">

    <a class="site-header__logo" href="https://rightbrain.ai/" aria-label="Rightbrain home">
      <img src="{{site.assetBase}}/public/logo.svg" alt="" class="site-header__logo-mark" width="28" height="28" aria-hidden="true">
      <span class="site-header__logo-name">Rightbrain.ai</span>
    </a>

    <nav class="site-header__nav" aria-label="Primary navigation" id="primary-nav">
      <a href="https://rightbrain.ai/b2b-services">For B2B Services</a>
      <a href="https://rightbrain.ai/platform-partners">For Partners</a>
      <a href="https://rightbrain.ai/resources-library" aria-current="{{nav.resourcesCurrent}}">Resources</a>
      <a href="https://docs.rightbrain.ai/docs/getting-started/introduction">Docs</a>

      <div class="site-header__nav-mobile-actions">
        <a
          class="site-header__slack"
          href="https://rightbrain-developers.slack.com/join/shared_invite/zt-2mt5nyavm-IiYim_3HzoJki7wr8oeHug#/shared-invite/email"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Join the Rightbrain Slack community"
        >
          <img src="{{site.assetBase}}/public/slack-icon.png" alt="" class="site-header__slack-icon" width="16" height="16" aria-hidden="true">
          <span class="site-header__slack-label">Slack</span>
        </a>
        <a
          class="btn btn--primary site-header__cta"
          href="https://calendly.com/flo-rightbrain/intro-call"
          target="_blank"
          rel="noopener noreferrer"
        >Book a Call</a>
      </div>
    </nav>

    <div class="site-header__actions">
      <button
        class="theme-toggle"
        id="theme-toggle"
        aria-label="Toggle colour scheme"
        type="button"
      >
        <svg class="theme-toggle__icon theme-toggle__icon--sun" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="5"/>
          <line x1="12" y1="1" x2="12" y2="3"/>
          <line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1" y1="12" x2="3" y2="12"/>
          <line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
        <svg class="theme-toggle__icon theme-toggle__icon--moon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>

      <a
        class="site-header__slack site-header__slack--desktop"
        href="https://rightbrain-developers.slack.com/join/shared_invite/zt-2mt5nyavm-IiYim_3HzoJki7wr8oeHug#/shared-invite/email"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Join the Rightbrain Slack community"
      >
        <img src="{{site.assetBase}}/public/slack-icon.png" alt="" class="site-header__slack-icon" width="16" height="16" aria-hidden="true">
      </a>

      <a
        class="btn btn--primary site-header__cta site-header__cta--desktop"
        href="https://calendly.com/flo-rightbrain/intro-call"
        target="_blank"
        rel="noopener noreferrer"
      >Book a Call</a>

      <button
        class="nav-toggle"
        id="nav-toggle"
        aria-label="Open navigation menu"
        aria-expanded="false"
        aria-controls="primary-nav"
        type="button"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" width="18" height="18">
          <line x1="3" y1="6" x2="21" y2="6"/>
          <line x1="3" y1="12" x2="21" y2="12"/>
          <line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>
    </div>

  </div>
</header>
